[project]
name = "llm-chat"
version = "0.6.0"
description = "Text interface to interact with several LLM models"
requires-python = ">=3.10,<4"
authors = [{ name = "autosquash", email = "49131885+autosquash@users.noreply.github.com" }]
readme = "README.md"

dependencies = [
  "mistralai>=0.1.3,<0.2.0",
  "openai>=1.14.1,<2.0.0",
  "rich>=13.7.1,<14.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "tomlkit>=0.12.4,<0.13.0",
]

[dependency-groups]
dev = [
  "mypy>=1.9.0,<2.0.0",
  "pytest>=8.1.1,<9.0.0",
  "coverage>=7.4.4,<8.0.0",
  "isort>=5.13.2,<6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
